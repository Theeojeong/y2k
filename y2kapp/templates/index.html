<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <main class="page">
      <section class="phone">
        <div class="phone__speaker"></div>
        <div class="phone__body">
          <div class="phone__screen">
            <div class="screen__status-bar">
              <span class="status__icon">✉︎</span>
              <span class="status__label" id="status-label">메시지 작성</span>
              <span class="status__count" id="byte-counter">0/80B</span>
            </div>
            <div class="screen__message" id="screen"></div>
            <div class="screen__toolbar">
              <button class="toolbar__menu" id="btn-menu" type="button">메뉴</button>
              <button class="toolbar__tab" data-mode="compose" type="button">작성</button>
            </div>
          </div>
          <form class="composer" id="composer-form" action="#" method="post" novalidate hidden></form>
        </div>
      </section>
    </main>
    
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
